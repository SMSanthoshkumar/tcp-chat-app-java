<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Santhosh - Server Chat</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #e9ecef; }
        .chat-box {
            height: 400px;
            overflow-y: auto;
            background-color: white;
            border: 1px solid #ccc;
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
<div class="container mt-5">
    <h3 class="text-center">🖥️ Server: Santhosh</h3>
    <div class="chat-box" id="chatServer">
        <p><strong>Mounesh:</strong> Hello!</p>
        <p><strong>Santhosh:</strong> Welcome bro!</p>
    </div>
    <form class="input-group">
        <input class="form-control" placeholder="Type a message..." />
        <button class="btn btn-primary" type="submit">Send</button>
    </form>
</div>
</body>
</html>
