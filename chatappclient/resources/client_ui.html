<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mounesh - Client Chat</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f8f9fa; }
        .chat-box {
            height: 400px;
            overflow-y: scroll;
            background: white;
            padding: 1rem;
            border: 1px solid #ccc;
            border-radius: 8px;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
<div class="container mt-5">
    <h3 class="text-center">Client: Mounesh</h3>
    <div class="chat-box" id="chatClient">
        <p><strong>Santhosh:</strong> Hello!</p>
        <p><strong>Mounesh:</strong> Hi!</p>
    </div>
    <form class="input-group">
        <input class="form-control" placeholder="Type a message..." />
        <button class="btn btn-success" type="submit">Send</button>
    </form>
</div>
</body>
</html>
